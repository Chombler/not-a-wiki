name: Deploy GitHub Pages

on:
  push:
    branches: [local-4.3.15]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Lint PHP source
        run: find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Build static site
        run: python3 scripts/build_pages.py --base-path /not-a-wiki
      - name: Validate static site
        run: python3 scripts/validate_pages.py --base-path /not-a-wiki
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
