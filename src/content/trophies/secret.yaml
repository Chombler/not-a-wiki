      <p><b>Requirement</b>: Spend 333 hours being Good across all reincarnations.(= 13d 21h)</p>
      <p><b>Cost</b>: 30 No (3e31), A1+ Free</p>
      <p><b>Effect</b>: Increase the production of Good buildings by 50%.</p>
  - id: "diabolical-evil-trophy"
