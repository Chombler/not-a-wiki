    icon: "diabolical-evil-trophy.png"
    body: |-
      <p><b>Requirement</b>: Spend 6 days, 66 hours, 666 minutes, 666666 seconds being Evil across all reincarnations (= 16d 22h 17m 6s).</p>
      <p><b>Cost</b>: 30 No (3e31), A1+ Free</p>
      <p><b>Effect</b>: Increase the production of Evil buildings by 50%.</p>
  - id: "assistant-squasher-trophy"
    name: "Assistant Squasher"
    icon: "assistant-squasher-trophy.png"
    body: |-
      <p><b>Requirement</b>: Click 100 times on the little assistant around your realm.</p>
      <p><b>Cost</b>: 100, A1+ Free</p>
      <p><b>Effect</b>: Instantly add 1 additional assistant.</p>
      <p><b>Note</b>: Click the assistant to the left of spells not the ones at the bottom of page.</p>
  - id: "rewind-trophy"
    name: "Rewind"
    icon: "rewind-trophy.png"
    body: |-
      <p><b>Requirement</b>: Abdicate after producing at least 1 Oc (1e27) Coins.</p>
      <p><b>Cost</b>: 1 Oc (1e27), A1+ Free</p>
      <p><b>Effect</b>: Increase the production of all buildings by 8%.</p>
  - id: "faction-grinder-trophy"
    name: "Faction Grinder"
    icon: "faction-grinder-trophy.png"
    body: |-
      <p><b>Requirement</b>: Purchase the first 6 Faction Heritage upgrades in a single game.</p>
      <p><b>Cost</b>: 1 M (1e6), A1+ Free</p>
      <p><b>Effect</b>: Increase your chance to find Faction Coins by additional 2%.</p>
      <p><b>Note</b>: This can be done at R0 (use Elven).</p>
  - id: "master-archeologist-trophy"
    name: "Master Archeologist"
    icon: "master-archeologist-trophy.png"
    body: |-
      <p><b>Requirement</b>: Unlock Titans, Druids, and Faceless</p>
      <p><b>Cost</b>: 1 Ud (1e36), A1+ Free</p>
      <p><b>Effect</b>: Increase the production of all buildings by 25% when you are playing as Titan, Druid or Faceless.</p>
      <p><b>Note</b>: This can be done at R0.</p>
  - id: "spellfury-trophy"
    name: "Spellfury"
    icon: "spellfury-trophy.png"
    body: |-
      <p><b>Requirement</b>: Cast the Tax Collection spell while having 3 other spells active.</p>
      <p><b>Cost</b>: 4333, A1+ Free</p>
      <p><b>Effect</b>: Multiplicatively increase Mana Regeneration by 5%.</p>
      <p><b>Note</b>: This can be done at R0.(use Angels and all their upgrades)</p>
  - id: "speed-run-trophy"
    name: "Speed Run"
    icon: "speed-run-trophy.png"
    body: |-
      <p><b>Requirement</b>: Reach 1 M (1e6) coins in less than 5 minutes, without using Gem Power.</p>
      <p><b>Cost</b>: 1 coins, A1+ Free</p>
      <p><b>Effect</b>: Increase your base clicking reward by +1 M (1e6).</p>
      <p><b>Note</b>: <a target="_blank" href="/realm/SpeedRun/"><b>Instructions</b></a></p>
      <p><b>Note</b>: This can be done at R0</p>
  - id: "equality-trophy"
    name: "Equality"
    icon: "equality-trophy.png"
    body: |-
      <p><b>Requirement</b>: With no less than 3 days of playtime, have less than 1 minute of playtime difference for the 3 alignments (Good, Evil, Neutral) (This R).</p>
      <p><b>Cost</b>: 1 Qad (1e45), A1+ Free</p>
      <p><b>Effect</b>: Increase the production of all buildings by 100%.</p>
      <p><b>Note</b>: This can be done at R0.</p>
      <p><b>Note</b>: Get the first 2 alignments at 24 hours then go to 3rd alignment and stay with it for 24 hours.</p>
  - id: "beard-carpet-trophy"
    name: "Beard Carpet"
    icon: "beard-carpet-trophy.png"
    body: |-
      <p><b>Requirement</b>: Have at least 43 meters of beard on your assistants (using the Bearded Assistants faction upgrade).</p>
      <p><b>Cost</b>: 3000, A1+ Free</p>
      <p><b>Effect</b>: Increase assistants production by 10%.</p>
      <p><b>Note</b>: This takes 1 hour, 12 minutes, and 1 second and can be done at R0.</p>
  - id: "premeditation-trophy"
    name: "Premeditation"
    icon: "premeditation-trophy.png"
    body: |-
      <p><b>Requirement</b>: Have at least 850 Dark Temples on any individual run before affiliating with the Drow.</p>
      <p><b>Cost</b>: 50 Ocd (5e58), A1+ Free</p>
      <p><b>Effect</b>: Increase maximum Mana by +250.</p>
  - id: "fast-forward-trophy"
    name: "Fast Forward"
    icon: "fast-forward-trophy.png"
    body: |-
      <p><b>Requirement</b>: Accumulate at least 8 hours offline in this Reincarnation. The sum of all offline reports counts.</p>
      <p><b>Cost</b>: 8 Oc (8e27), A1+ Free</p>
      <p><b>Effect</b>: Increase offline production by 200%.</p>
      <p><b>Note</b>: This can be done at R0.</p>
  - id: "need-a-headstart-trophy"
    name: "Need a Head Start?"
    icon: "need-a-headstart-trophy.png"
    body: |-
      <p><b>Requirement</b>: Don't do anything for 5 minutes after starting a new Era. Don't buy anything and don't click anything.</p>
      <p><b>Cost</b>: Free</p>
      <p><b>Effect</b>: Instantly adds 25 coins of the current Ascension currency.</p>
      <p><b>Note</b>: This can be done at the start of any reincarnation or abdication.</p>
  - id: "realm-digger-trophy"
    name: "Realm Digger"
    icon: "realm-digger-trophy.png"
    body: |-
      <p><b>Requirement</b>: Excavate 400 times.</p>
      <p><b>Cost</b>: 100 Nod (1e62), A1+ Free</p>
      <p><b>Effect</b>: Increases the production of all buildings by 0.15% per excavation.</p>
      <p><b>Note</b>: This can be done at R0.</p>
  - id: "harlequin-trophy"
    name: "Harlequin"
    icon: "harlequin-trophy.png"
    body: |-
      <p><b>Requirement</b>: As a Mercenary, purchase one upgrade from 11 different factions.</p>
      <p><b>Cost</b>: 5 Qivg (5e78), A1, Free</p>
      <p><b>Effect</b>: Increases the production of all buildings based on the number of different Factions involved in your Mercenary upgrades. Improves over time spent as your least-used alignment in this Reincarnation.</p>
      <p><b>Formula</b>: (10 + x ^ 3 * (1 + 0.03 * y ^ 0.7))%, where x is the number of different Factions involved in your Mercenary upgrades and y is time spent as your least-used alignment in this Reincarnation, in seconds.</p>
      <p><b>Note</b>: See the <a target="_blank" href="/realm/MercBuilds/#TrophyBuilds"><b>Mercenary trophy builds</b></a>.</p>
  - id: "lucifer-trophy"
    name: "Lucifer"
    icon: "lucifer-trophy.png"
    body: |-
      <p><b>Requirement</b>: As a Good Mercenary, purchase only Evil mercenary faction upgrades or vice versa.</p>
      <p><b>Cost</b>: 5e64 coins</p>
      <p><b>Effect</b>: Increases the production of all non-neutral buildings by 300%.</p>
      <p><b>Note</b>: See the <a target="_blank" href="/realm/MercBuilds/#TrophyBuilds"><b>Mercenary trophy builds</b></a>.</p>
  - id: "mathematician-trophy"
    name: "Mathematician"
    icon: "mathematician-trophy.png"
    body: |-
      <p><b>Requirement</b>: Have buildings amounts exactly equal to 2^tier from bottom to top, starting from 2^0 Halls of Legends up to 2^10 Farms. (1024 Farms, 512 Inns, 256 Blacksmiths, 128, 64, 32, 16, 8, 4, 2 and 1 Hall of Legends.) (Building count has to be exact)</p>
      <p><b>Cost</b>: 1 Td (1e42), A1, Free</p>
      <p><b>Effect</b>: Increases the production of all buildings based on their tier.</p>
      <p><b>Formula</b>: (10 * (12 - T))%, where T is building tier.</p>
      <p><b>Table</b>: Select this trophy to view its bonus for each building.</p>
      <p><b>Note</b>: This can be done at the end of R0 just before reincarnating.</p>
  - id: "mercenary-spirit-trophy"
    name: "Mercenary Spirit"
    icon: "mercenary-spirit-trophy.png"
    body: |-
      <p><b>Requirement</b>: Reincarnate while playing as a Mercenary.</p>
      <p><b>Cost</b>: 1 Ocd (1e57), A1, Free</p>
      <p><b>Effect</b>: For Mercenaries only, increases the production of all buildings based on the activity time of your least-used spell in this Reincarnation. Improves as you Reincarnate more.</p>
      <p><b>Formula</b>: (10 * x + 2 * y ^ 0.8)%, where x is your effective Reincarnation count and y is the activity time of your least-used eligible spell in this Reincarnation, in seconds.</p>
      <p><b>Note</b>: This can be done at R3.</p>
  - id: "bloodstream-trophy"
    name: "Bloodstream"
    icon: "bloodstream-trophy.png"
    body: |-
      <p><b>Requirement</b>: Purchase 100 upgrades of each faction (Anything that is faction colored counts) (All Game)</p>
      <p><b>Cost</b>: 1 Tg (1e93), A1, Free</p>
      <p><b>Effect</b>: Increases the production of all buildings based on the time spent with the Bloodline's Faction. When playing as Mercenary: Your mercenary time is multiplied by the number of Bloodline's faction upgrades, divided by twelve, is added as time spent with the Bloodline's Faction.</p>
      <p><b>Formula</b>: (0.1 * x ^ 0.65)%, where x is your (adjusted) time spent affiliated with the bloodline's faction in seconds.</p>
      <p><b>Note</b>: The Bloodline upgrade appears at the 7th reincarnation and requires you to have bought a total of 100 Faction upgrades of each faction, total across reincarnations. Upgrades such as Trade Treaties, Friendship Pacts, Alliances, Heritages, and Spell Upgrades all count towards this.</p>
      <p><b>Note</b>: This can be done at R7</p>
  - id: "unlimited-mana-trophy"
    name: "Unlimited Mana"
    icon: "unlimited-mana-trophy.png"
    body: |-
      <p><b>Requirement</b>: Have a Mana Regeneration rate of at least 300 per second.</p>
      <p><b>Cost</b>: 80 Vg (8e64), A1+ Free</p>
      <p><b>Effect</b>: Increase Mana Regeneration by +2.</p>
  - id: "for-science-trophy"
