# Canonical, human-authored trophy records. Both trophy pages render this file.
category: "secret"
label: "Secret Trophies"
order: 0
trophies:
  - id: "leet-trophy"
    name: "Leet"
    icon: "leet-trophy.png"
    body: |-
      <p><b>Requirement</b>: Have exactly 1337 Coins at any given time.</p>
      <p><b>Cost</b>: 1337 coins</p>
      <p><b>Note</b>: This can be done at any R</p>
      <p><b>Effect</b>: Increase the production of all buildings by 13.37%.</p>
  - id: "unitary-trophy"
    name: "Unitary"
    icon: "unitary-trophy.png"
    body: |-
      <p><b>Requirement</b>: Have exactly 1 of each building at any given time.</p>
      <p><b>Cost</b>: 1111, A1+ Free</p>
      <p><b>Effect</b>: Increase the production of all buildings by 11.11111111%</p>
      <p><b>Note</b>: This can be done at any R</p>
  - id: "building-hater-trophy"
    name: "Building Hater"
    icon: "building-hater-trophy.png"
    body: |-
      <p><b>Requirement</b>: Reach 100,000 coins without building anything.</p>
      <p><b>Cost</b>: 1, A1+ Free</p>
      <p><b>Note</b>: This can be done at any R.</p>
      <p><b>Effect</b>: Increase clicking reward by 25%</p>
  - id: "grand-diplomat-trophy"
    name: "Grand Diplomat"
    icon: "grand-diplomat-trophy.png"
    body: |-
      <p><b>Requirement</b>: Ally with each Vanilla, Neutral and Prestige factions at least once.</p>
      <p><b>Cost</b>: 1, A1+ Free</p>
      <p><b>Effect</b>: Increase your chance to find Faction Coins by an additional 2%</p>
      <p><b>Note</b>: This can be done at any R.</p>
  - id: "exchange-master-trophy"
    name: "Exchange Master"
    icon: "exchange-master-trophy.png"
    body: |-
      <p><b>Requirement</b>: Purchase 500 Royal Exchanges in a single game.</p>
      <p><b>Cost</b>: 500 Dc (5e35), A1+ Free</p>
      <p><b>Effect</b>: Increase Royal Exchange bonus by +5%</p>
      <p><b>Note</b>: This can be done at any R, The higher the R the easier it will be</p>
  - id: "lucky-neutral-trophy"
    name: "Lucky Neutral"
    icon: "lucky-neutral-trophy.png"
