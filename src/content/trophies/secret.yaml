      <p><b>Cost</b>: 1 Tg (1e93), A1, Free</p>
      <p><b>Effect</b>: Increase Mercenary production by 1% per Reincarnation.</p>
      <p><b>Note</b>: Advised to do once you have Prestige Research.</p>
  - id: "that-excavated-quickly-trophy"
    name: "That Excavated Quickly"
    icon: "that-excavated-quickly-trophy.png"
    body: |-
      <p><b>Requirement</b>: Excavate 1000 times in the first 30 seconds of a run (This Era)</p>
      <p><b>Cost</b>: 1 Qag (1e123), A1+ Free</p>
      <p><b>Effect</b>: Increase the base Faction Coins found with excavations by +250.</p>
      <p><b>Note</b>: Around R20, make sure to keep your excavations low until you have enough gems to excavate 1000 times - make a save file, abdicate, then try go for the trophy. Undo if necessary.</p>
  - id: "glho-kohhl-snod-trophy"
    name: "glho kohhl snod"
    icon: "glho-kohhl-snod-trophy.png"
    body: |-
      <p><b>Requirement</b>: Import 'glho kohhl snod' into you game without the quotes.</p>
      <p><b>Cost</b>: 1000 coins, A1+ Free</p>
      <p><b>Effect</b>: Increase clicking reward by 50%.</p>
      <p><b>Note</b>: This can be done at any time.</p>
  - id: "mana-matrix-trophy"
    name: "Mana Matrix"
    icon: "mana-matrix-trophy.png"
    body: |-
      <p><b>Requirement</b>: Have exactly 4767 maximum Mana.</p>
      <p><b>Cost</b>: 1000 coins, A1+ Free</p>
      <p><b>Effect</b>: Multiplicatively increase Maximum Mana by 15%.</p>
  - id: "suggestion-master-trophy"
    name: "Suggestion Master"
    icon: "suggestion-master-trophy.png"
    body: |-
      <p><b>Requirement</b>: Open the changelog and ponder about what could be added in there for 3 minutes.</p>
      <p><b>Cost</b>: 1000 coins, A1+ Free</p>
      <p><b>Effect</b>: Increase the production of all buildings based on the current game version.</p>
      <p><b>Formula</b>: (10 * a + b + 0.1 * c + 0.01 * d)%, using the four version components encoded by the game. Version 4.3.12 evaluates this bonus to 43.12%.</p>
      <p><b>Note</b>: Click the Option tab and click the numbers in the bottom right corner and leave it open for 3 minutes.</p>
  - id: "rule-dis-trophy"
    name: "Rule'dis"
    icon: "rule-dis-trophy.png"
    body: |-
      <p><b>Requirement</b>: Abdicate 10 times within 3 minutes.</p>
      <p><b>Cost</b>: 1000 coins, A1+ Free</p>
      <p><b>Effect</b>: Increase Mana Regeneration by +1.</p>
      <p><b>Note</b>: This can be done at any R.</p>
  - id: "because-i-like-to-grind-trophy"
    name: "Because I Like to Grind"
    icon: "because-i-like-to-grind-trophy.png"
    body: |-
      <p><b>Requirement</b>: Spend at least 3 hours playing in this Era.</p>
      <p><b>Cost</b>: 1000 coins, A1+ Free</p>
      <p><b>Effect</b>: Increase Royal Exchange bonus by an additional 1%.</p>
  - id: "triple-weirdness-trophy"
    name: "Triple Weirdness"
    icon: "triple-weirdness-trophy.png"
    body: |-
      <p><b>Requirement</b>: 333 of each Royal Exchange, R40+</p>
      <p><b>Cost</b>: 1 TTg (1e102), A2+, Free</p>
      <p><b>Effect</b>: Increase Faction Coins generation while offline based on your Mana Regeneration.</p>
      <p><b>Formula</b>: (300 * ln(1 + x) ^ 3)%, where x is Mana Regeneration (mana/s).</p>
  - id: "stoic-resistance-trophy"
    name: "Stoic Resistance"
    icon: "stoic-resistance-trophy.png"
    body: |-
      <p><b>Requirement</b>: Reach an amount of Gems in your treasury equal to the requisite of the first Reincarnation (1 Oc (1e27) gems) without abdicating since the start of a new Reincarnation.</p>
      <p><b>Cost</b>: Free</p>
      <p><b>Gems Needed</b>: A0 = 1 Oc (1e27), A1 = 177.8 Qi (1.778e20), A2 = 1.540 Qa (1.540e15), A3 = 245.8 B (2.458e11), A4 = 349.1 M (3.491e8)</p>
      <p><b>Effect</b>: Instantly add 10 Qa (1e16) coins of the current Ascension currency.</p>
  - id: "vanishment-trophy"
    name: "Van!shment"
    icon: "vanishment-trophy.png"
    body: |-
      <p><b>Requirement</b>: Reach an Offline Bonus of at least 1 Qa (1e15) % (Post-Ascension is 1895%).</p>
      <p><b>Cost</b>: 10 Noqag (1e151), A1+ Free</p>
      <p><b>Effect</b>: Increase the production of all buildings based on offline bonus.</p>
      <p><b>Formula</b>: (1.25 * ln(1 + x) ^ 1.25)%, where x is your Offline production multiplier.</p>
  - id: "iron-rush-trophy"
