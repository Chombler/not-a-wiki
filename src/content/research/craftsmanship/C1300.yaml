name: Scintillation
branch: craftsmanship
availableTo: Neutral,Dragon
details:
  - label: Hint
    text: Increase your magic potential.
  - label: Requirement
    text: 100,000 Maximum Mana, as any Neutral Dragon
  - label: Cost
    text: "1.948e71"
  - label: Effect
    text: Increase production of buildings based on max mana and additive gem bonus. (Higher boost for
      lower gem bonus.)
