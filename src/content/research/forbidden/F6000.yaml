details:
  - label: Requirement
    text: R182+, Forgotten Relic, Apeiron artifact and upgrade, and 3,600 seconds (1 hour) spent as
      Mercenary.
  - label: Cost
    text: Free
  - label: Effect
    text: Increase your next time head start based on time spent in this Era.
