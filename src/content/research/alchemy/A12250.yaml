name: Folgoration
branch: alchemy
availableTo: All Factions
details:
  - label: Cost
    text: Free
  - label: Requirement
    text: R232+ and 3 Excavation Resets in this Era
  - label: Effect
    text: While both Diamond Pickaxe and God's Hand are active, multiplicatively increase Mana
      Regeneration and Faction Coin find chance based on the amount of Excavations made in this
      Reincarnation, including resets.
