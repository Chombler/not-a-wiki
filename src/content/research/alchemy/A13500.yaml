    text: Free
  - label: Requirement
    text: R242+ and 7,200 seconds spent as Balance in this Reincarnation
  - label: Effect
    text: All Balance spells can be cast up to 3 tier above their maximum. Increase Offline production
      based on time spent as Balance in this Reincarnation.
