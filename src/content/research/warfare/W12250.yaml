code: W12250
name: Raiding
branch: warfare
availableTo: All Factions
details:
  - label: Cost
    text: Free
  - label: Requirement
    text: R232+ and a Combo Strike counter of at least 1 M (1e6).
  - label: Effect
    text: Increase the production of all buildings based on the highest Combo Strike counter you had in
      this Reincarnation.
  - label: Formula
    text: (0.01 * ln(1 + x) ^ 5)%, where x is the highest Combo Strike counter in this Reincarnation.
