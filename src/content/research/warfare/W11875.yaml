details:
  - label: Cost
    text: Free
  - label: Requirement
    text: R229+ and at least 5 Primal Balance targets.
  - label: Effect
    text: Buildings count more based on the maximum amount of Grand Balance targets you had in this
      Reincarnation.
  - label: Formula
    text: (x ^ 0.9)%, where x is the maximum amount of Grand Balance targets you had in this
      Reincarnation.
